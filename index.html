/* ======================================================================
   ENTRY PAGE — "EMERGENT INTELLIGENCE"
   A pre-site threshold: an agent-based stigmergy simulation under a
   sheet of liquid glass, with a click-through portal into the portfolio.
   All entry styles are namespaced with .ei- to avoid collisions.
   ====================================================================== */
:root{
  --ei-noir:#0d0c09;
  --ei-ink:#0c110f;
  --ei-paper:#f4f3ee;
  --ei-mut:rgba(244,243,238,.6);
  --ei-faint:rgba(244,243,238,.34);
  --ei-line:rgba(244,243,238,.16);
  --ei-serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --ei-mono:'Spline Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --ei-sans:'Spline Sans', system-ui, -apple-system, sans-serif;
  --ei-ease:cubic-bezier(.22,.61,.36,1);
  --mx:50vw; --my:42vh;     /* cursor position (light bending)         */
  --px:50vw; --py:64vh;     /* portal centre (aperture origin)         */
  --apscale:240;            /* aperture fill scale, set by JS          */
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--ei-paper);color:var(--ei-noir)}
html,body{height:100%;width:100%;overflow:hidden;background:var(--ei-noir)}
body{
  font-family:var(--ei-sans);
  color:var(--ei-paper);
  position:fixed;inset:0;
  -webkit-font-smoothing:antialiased;
}
/* custom circular cursor — a thin sensing probe moving through the agent field */
.ei-cursor{position:fixed;left:0;top:0;z-index:40;display:none;pointer-events:none;
  --cs:30px; --e:0;
  width:var(--cs);height:var(--cs);
  margin:calc(var(--cs)/-2) 0 0 calc(var(--cs)/-2);
  border-radius:50%;opacity:0;
  border:1px solid rgba(244,243,238, calc(.42 + .48*var(--e)));
  background:radial-gradient(circle, rgba(120,231,214, calc(.05*var(--e))), rgba(120,231,214,0) 70%);
  box-shadow:0 0 calc(5px + 14px*var(--e)) rgba(120,231,214, calc(.10*var(--e))),
             inset 0 0 calc(3px + 7px*var(--e)) rgba(120,231,214, calc(.10*var(--e)));
  transition:opacity .35s var(--ei-ease);
  will-change:transform;
}
@media (max-width:680px){ .ei-cursor{--cs:24px} }
@media (prefers-reduced-motion: reduce){ .ei-cursor{box-shadow:none} }
/* hide the native cursor + reveal the custom cursor ONLY on precise-hover devices (never touch) */
@media (hover:hover) and (pointer:fine){
  body{cursor:none}
  .ei-portal{cursor:none}
  .ei-cursor{display:block}
}

/* --- background: deep green-black refractive surface + grain --- */
.ei-bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 90% at 50% 30%, #101916 0%, #0a0e0d 48%, #0d0c09 100%);
}
.ei-bg::before{ /* light that bends toward the cursor */
  content:"";position:absolute;inset:0;
  background:radial-gradient(420px 420px at var(--mx) var(--my),
    rgba(120,231,214,.10), rgba(120,231,214,0) 60%);
  transition:background-position .2s linear;
}
.ei-bg::after{ /* fine grain for depth */
  content:"";position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* --- simulation canvases --- */
.ei-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ei-trail{z-index:1}   /* pheromone memory (fades slowly)  */
#ei-top{z-index:2}     /* agent glow points, pulses, glow   */

/* --- liquid-glass cursor lens: literally refracts the trails beneath --- */
.ei-lens{position:fixed;z-index:3;left:0;top:0;width:130px;height:130px;
  margin:-65px 0 0 -65px;border-radius:50%;pointer-events:none;opacity:0;
  -webkit-backdrop-filter:blur(4.5px) saturate(108%);
  backdrop-filter:blur(4.5px) saturate(108%);
  background:radial-gradient(circle at 38% 34%, rgba(244,243,238,.05), rgba(244,243,238,0) 60%);
  box-shadow:inset 0 0 16px rgba(244,243,238,.03), inset 0 0 1px rgba(244,243,238,.12);
  transition:opacity .5s var(--ei-ease);
  will-change:transform;
}

/* --- content layer --- */
.ei-content{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:clamp(22px,5vw,64px);text-align:center;pointer-events:none}
.ei-content > *{pointer-events:auto}

/* HUD — small computational-interface readouts */
.ei-hud{position:fixed;z-index:11;font-family:var(--ei-mono);font-size:10.5px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ei-faint);pointer-events:none}
.ei-hud-tl{left:clamp(18px,4vw,40px);top:clamp(18px,4vw,34px)}
.ei-hud-tr{right:clamp(18px,4vw,40px);top:clamp(18px,4vw,34px);text-align:right;line-height:1.9}
.ei-hud-tr b{color:var(--ei-mut);font-weight:400}

.ei-center{display:flex;flex-direction:column;align-items:center;gap:0}
.ei-eyebrow{font-family:var(--ei-mono);font-size:11px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--ei-faint);margin-bottom:26px}
.ei-title{font-family:var(--ei-serif);font-weight:300;letter-spacing:.005em;
  font-size:clamp(2.6rem,8.2vw,6.4rem);line-height:.96;color:var(--ei-paper)}
.ei-sub{font-family:var(--ei-mono);font-size:clamp(11px,1.5vw,14px);letter-spacing:.16em;
  color:var(--ei-mut);margin-top:22px}
.ei-id{font-family:var(--ei-mono);font-size:11px;letter-spacing:.14em;color:var(--ei-faint);
  margin-top:30px;line-height:1.9}
.ei-id span{display:block;color:rgba(244,243,238,.42)}

/* --- liquid-glass portal --- */
.ei-portal{position:relative;margin-top:clamp(30px,5vh,52px);width:34px;height:34px;
  display:grid;place-items:center;border-radius:50%;text-decoration:none;color:var(--ei-paper);
  --mgx:0px; --mgy:0px;
  -webkit-backdrop-filter:blur(5px) saturate(116%);backdrop-filter:blur(5px) saturate(116%);
  background:radial-gradient(circle at 40% 34%, rgba(244,243,238,.14), rgba(244,243,238,.04) 60%, rgba(244,243,238,0) 72%);
  border:1px solid rgba(244,243,238,.26);
  box-shadow:inset 0 0 10px rgba(120,231,214,.10), inset 0 1px 1px rgba(244,243,238,.24),
             0 12px 28px -20px rgba(0,0,0,.8), 0 0 0 rgba(120,231,214,0);
  transform:translate(var(--mgx),var(--mgy));
  transition:transform .45s var(--ei-ease), box-shadow .6s var(--ei-ease), border-color .6s var(--ei-ease);
  outline:none;
}
/* keep a comfortable touch/click target around the tiny portal */
.ei-portal::after{content:"";position:absolute;inset:-16px;border-radius:50%}
.ei-portal::before{content:"";position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(120,231,214,.0), rgba(120,231,214,.35), rgba(232,177,90,.2), rgba(183,156,255,.3), rgba(120,231,214,0));
  opacity:.0;filter:blur(7px);transition:opacity .6s var(--ei-ease);z-index:-1;animation:ei-spin 14s linear infinite}
@keyframes ei-spin{to{transform:rotate(360deg)}}
.ei-portal-core{width:4px;height:4px;border-radius:50%;background:rgba(244,243,238,.92);

<script>
/* ======================================================================
   EMERGENT INTELLIGENCE — entry simulation
   Sections:
     1. CONFIG (tuning knobs)
     2. Setup: canvas / DPR / resize / reduced-motion / fallback
     3. Pheromone field (grid scalar field — the stigmergy "brain")
     4. Agents (scout / builder / connector / repair local rules)
     5. Cursor interaction (environmental force + pheromone source)
     6. Pulses (click)

(function(){

var CONFIG = {

  trailVisibility: 0.72,   // 0 = sparse / fast fade, 1 = long persistent trails
  agentSize    : 0.65,     // size multiplier for the agent points

  bloomOn      : true,     // false -> simple quiet fade transition (no membrane bloom)

  diffuse      : 0.14,    // field diffusion (path merging / coalescence)
  sensorAngle  : 0.55,    // radians between the 3 pheromone sensors
  sensorDist   : 11,      // how far ahead agents "smell" (px)
  turnAngle    : 0.46,    // base steer strength toward stronger pheromone
  speedMul     : 1.30,    // global agent base-speed (liveliness)
  wander       : 0.5,     // idle wander/jitter multiplier (calm, field-like)
  flowField    : 0.12,    // laminar flow-field drift (0 = pure stigmergy)
  cursorPullMul: 1.0,     // cursor attraction multiplier (live)
  align        : 0.06,    // flock alignment toward local flow field
  cursorRadius : 210,     // cursor influence radius (px)
  cursorPull   : 0.20,    // base cursor attraction (0..1 angle lerp)
  cursorForce  : 1.1,     // physical push/pull impulse magnitude
  cursorFastSpeed: 14,    // cursor speed above which wake/turbulence begins
  pheromone    : 1.0,     // global deposit multiplier (path strength)
  cursorDeposit: 8.0,     // strength of the cursor pheromone source
  glassBlur    : 7,       // liquid-glass lens blur (px)
  portalAttract: 9.0,     // portal pheromone strength on hover
  portalHoverPull  : 0.06,// direct drift toward portal on hover (0..1)
  portalHoverRadius: 360, // radius for portal hover drift (px)
  cursorReact  : 120,     // px radius at which the custom cursor senses agents
  cursorMaxScale: 0.35,   // extra scale at full energy (1.0 -> 1.35)

  transitionDecaySlowdown  : 0.992,  // grid decay during transition (->1 = longer memory)
  transitionDiffuse        : 0.42,   // grid diffusion during transition (spreads the gradient)
  transitionTrailFade      : 0.010,  // visible-trail fade during transition (persistence)

  agentAlignmentStrength   : 0.14,   // collective flow during transition

function setup(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio||1, reduced?1:2);
  sizeCanvas(trail); sizeCanvas(top);
  tctx.setTransform(dpr,0,0,dpr,0,0);
  octx.setTransform(dpr,0,0,dpr,0,0);
  tctx.lineCap='round'; tctx.lineJoin='round';

  // grid: coarser on small / reduced for performance
  SCALE = (W<=600||reduced) ? 9 : (W<=1024 ? 8 : 6);
  gw = Math.ceil(W/SCALE)+1; gh = Math.ceil(H/SCALE)+1;
  field = new Float32Array(gw*gh);
  ftmp  = new Float32Array(gw*gh);
  flowX = new Float32Array(gw*gh);   // local average heading (alignment / flocking)
  flowY = new Float32Array(gw*gh);

  buildGlowSprites();
  updatePortalCentre();
}

/* ---------- 3. PHEROMONE FIELD (the stigmergy brain) ----------------- */
function fieldIndex(x,y){
  var gx = x/SCALE|0, gy = y/SCALE|0;
  if(gx<0)gx=0; else if(gx>=gw)gx=gw-1;
  if(gy<0)gy=0; else if(gy>=gh)gy=gh-1;
  return gy*gw+gx;
}
function sample(x,y){ return field[fieldIndex(x,y)]; }
function deposit(x,y,amt){ field[fieldIndex(x,y)] += amt; }
function depositBlob(x,y,amt,r){            // soft circular pheromone source
  var c=(r/SCALE)|0; var cx=x/SCALE|0, cy=y/SCALE|0;
  for(var j=-c;j<=c;j++)for(var i=-c;i<=c;i++){
    var gx=cx+i, gy=cy+j; if(gx<0||gy<0||gx>=gw||gy>=gh) continue;
    var d=Math.sqrt(i*i+j*j); if(d>c) continue;
    field[gy*gw+gx]+= amt*(1-d/c);
  }
}
// decay + light diffusion -> reinforced paths merge & memory fades
function stepField(){
  var f=field,t=ftmp,w=gw,h=gh,
      D  = entering ? CONFIG.transitionDiffuse      : CONFIG.diffuse,
      dec= entering ? CONFIG.transitionDecaySlowdown: CONFIG.pheromoneDecay;
  var fx=flowX, fy=flowY, fdec=0.90;   // flow fades faster -> fresh, local alignment
  for(var y=0;y<h;y++){
    var yo=y*w, yu=(y>0?y-1:y)*w, yd=(y<h-1?y+1:y)*w;
    for(var x=0;x<w;x++){
      var xl=x>0?x-1:x, xr=x<w-1?x+1:x, k=yo+x;
      var blur=(f[yu+x]+f[yd+x]+f[yo+xl]+f[yo+xr])*0.25;
      t[k]=(f[k]*(1-D)+blur*D)*dec;
      fx[k]*=fdec; fy[k]*=fdec;
    }
  }
  var s=field; field=ftmp; ftmp=s;   // swap buffers
}

/* ---------- 4. AGENTS ------------------------------------------------- */
var agents=[];
var agentTarget=0, agentsUserSet=false;          // live agent-count control
function setAgentCount(n){
  n=Math.max(8, Math.round(n)); agentTarget=n;
  while(agents.length<n) agents.push(makeAgent());
  if(agents.length>n) agents.length=n;
}
// role-specific trail colours (kept subtle; mostly white with an accent)
var COLORS={};
COLORS[ROLE.SCOUT]    ='rgba(244,243,238,0.075)';
COLORS[ROLE.BUILDER]  ='rgba(120,231,214,0.130)';
COLORS[ROLE.CONNECTOR]='rgba(232,177,90,0.100)';
COLORS[ROLE.REPAIR]   ='rgba(183,156,255,0.085)';
var DOTCOL={};
DOTCOL_init();
function DOTCOL_init(){
  DOTCOL[ROLE.SCOUT]='244,243,238';
  DOTCOL[ROLE.BUILDER]='120,231,214';
  DOTCOL[ROLE.CONNECTOR]='232,177,90';
  DOTCOL[ROLE.REPAIR]='183,156,255';
}

function rolePick(){
  var r=Math.random();
  if(r<0.46) return ROLE.SCOUT;
  if(r<0.76) return ROLE.BUILDER;
  if(r<0.91) return ROLE.CONNECTOR;
  return ROLE.REPAIR;
}
function makeAgent(){
  var role=rolePick();
  var a={
    x:Math.random()*W, y:Math.random()*H, h:Math.random()*Math.PI*2,
    px:0, py:0, role:role, dvx:0, dvy:0, near:0, spin:(Math.random()<0.5?-1:1),
    so:CONFIG.sensorDist, sa:CONFIG.sensorAngle, ra:CONFIG.turnAngle,
    senseW:1, jitter:0.18, deposit:1.2, tw:1, baseSpeed:0.7, speed:0.7,
    cursorR:CONFIG.cursorRadius, cursorPull:CONFIG.cursorPull, slowBoost:1.6,
    color:COLORS[role], dot:DOTCOL[role], glow:0.6
  };
  // per-role tuning -> visible behavioural differences
  if(role===ROLE.SCOUT){     a.sa=0.7; a.ra=0.6; a.senseW=0.55; a.jitter=0.5;  a.deposit=0.7; a.tw=0.8; a.baseSpeed=0.95; a.cursorPull=0.05; a.glow=0.45; }
  if(role===ROLE.BUILDER){   a.sa=0.45;a.ra=0.4; a.senseW=1.25; a.jitter=0.10; a.deposit=2.1; a.tw=1.4; a.baseSpeed=0.62; a.cursorPull=0.26; a.slowBoost=2.1; a.glow=0.9; }
  if(role===ROLE.CONNECTOR){ a.sa=0.5; a.ra=0.26;a.senseW=1.0;  a.jitter=0.12; a.deposit=1.2; a.tw=1.0; a.so=16; a.baseSpeed=0.78; a.cursorPull=0.14; a.glow=0.7; }
  if(role===ROLE.REPAIR){    a.sa=0.4; a.ra=0.22;a.senseW=0.9;  a.jitter=0.05; a.deposit=0.9; a.tw=1.0; a.baseSpeed=0.55; a.cursorPull=0.10; a.glow=0.6; }
  a.speed=a.baseSpeed; a.px=a.x; a.py=a.y;
  return a;
}
function seedAgents(){
  agents.length=0; var n=agentCount();
  for(var i=0;i<n;i++) agents.push(makeAgent());
}

// pre-rendered glow sprites (one per role) -> fast drawImage, no per-frame gradients
var glow={};
function buildGlowSprites(){
  for(var k in DOTCOL){ (function(role){
    var s=document.createElement('canvas'); var R=26; s.width=s.height=R*2;
    var g=s.getContext('2d'); var rad=g.createRadialGradient(R,R,0,R,R,R);
    var col=DOTCOL[role];
    rad.addColorStop(0,'rgba('+col+',0.95)');
    rad.addColorStop(0.25,'rgba('+col+',0.5)');
    rad.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=rad; g.fillRect(0,0,R*2,R*2);
    glow[role]=s;
  })(k); }
}

function angLerp(a,b,t){
  var d=Math.atan2(Math.sin(b-a),Math.cos(b-a));
  return a+d*t;
}

// dispersion (how spread out the system is) -> drives Repair agents
var cxc=0, cyc=0, dispersion=0, dispTick=0;
function measureDispersion(){
  var sx=0,sy=0,n=agents.length; if(!n) return;
  for(var i=0;i<n;i++){ sx+=agents[i].x; sy+=agents[i].y; }
  cxc=sx/n; cyc=sy/n; var s=0;
  for(i=0;i<n;i++){ var dx=agents[i].x-cxc, dy=agents[i].y-cyc; s+=Math.sqrt(dx*dx+dy*dy); }
  dispersion=(s/n)/Math.max(W,H);   // ~0 tight ... ~0.4 dispersed
}

function flowAng(x,y){ var xn=x/W, yn=y/H, t=flowNow;
  return (Math.sin(xn*6.2+t*0.00013)+Math.cos(yn*4.6-t*0.0001)
        + 0.6*Math.sin((xn+yn)*8.4+t*0.00007))*(Math.PI*0.9); }
function updateAgent(a,dt){
  // -- 3-sensor pheromone steering (Physarum / ant style) --
  var h=a.h, so=a.so;
  var c=sample(a.x+Math.cos(h)*so,      a.y+Math.sin(h)*so);
  var l=sample(a.x+Math.cos(h-a.sa)*so, a.y+Math.sin(h-a.sa)*so);
  var r=sample(a.x+Math.cos(h+a.sa)*so, a.y+Math.sin(h+a.sa)*so);
  var turn;
  if(c>=l && c>=r) turn=0;
  else if(l>r)     turn=-a.ra;
  else if(r>l)     turn= a.ra;
  else             turn=(Math.random()-0.5)*a.ra*2;
  // scouts avoid overcrowding: steer away from very strong local field
  if(a.role===ROLE.SCOUT && c>22) turn += (Math.random()<0.5?-1:1)*a.ra;
  var follow = entering ? CONFIG.pheromoneFollowStrength : 1;     // follow reinforced paths harder
  var jitM   = entering ? 0.22 : CONFIG.wander;                  // repair-like smoothing for all
  a.h += turn*a.senseW*follow + (Math.random()-0.5)*a.jitter*jitM;
  if(!entering && CONFIG.flowField>0) a.h=angLerp(a.h, flowAng(a.x,a.y), CONFIG.flowField);

  // -- alignment with the local flow field (subtle flocking along trails) --
  var fk=fieldIndex(a.x,a.y), fvx=flowX[fk], fvy=flowY[fk];
  if(fvx*fvx+fvy*fvy>0.02) a.h=angLerp(a.h, Math.atan2(fvy,fvx), entering?CONFIG.agentAlignmentStrength:CONFIG.align);

  // -- cursor as an environmental force: attract / orbit (slow) or repel / wake (fast) --
  a.near=0;
  if(cursor.active && !entering){
    var dx=cursor.x-a.x, dy=cursor.y-a.y, R=CONFIG.cursorRadius, d2=dx*dx+dy*dy;
    if(d2 < R*R){
      var d=Math.sqrt(d2)||1, fall=1-d/R, ux=dx/d, uy=dy/d;
      a.near=fall;
      if(cursor.fast){
        // fast cursor -> wake: scatter outward, carried along the cursor's velocity
        var fr=CONFIG.cursorForce*fall*(reduced?0.5:1.4);
        a.dvx += (-ux*0.6 + cursor.vx*0.05)*fr;
        a.dvy += (-uy*0.6 + cursor.vy*0.05)*fr;
        a.h   += (Math.random()-0.5)*0.7*fall;        // turbulence
        a.speed = a.baseSpeed*1.7;
      } else {
        // slow cursor -> attraction + orbit -> local clustering
        var base=Math.atan2(dy,dx);
        var target = (a.role===ROLE.CONNECTOR) ? base+Math.PI/2          // orbit
                   : (a.role===ROLE.SCOUT)     ? base+Math.PI*0.6        // gentle avoid
                   : base;                                               // follow
        a.h=angLerp(a.h, target, Math.min(0.55, a.cursorPull*CONFIG.cursorPullMul*fall*a.slowBoost));
        var fr2=CONFIG.cursorForce*fall*0.5*(reduced?0.4:1);
        a.dvx += ux*fr2; a.dvy += uy*fr2;             // gentle physical pull
        a.speed += (a.baseSpeed*1.25 - a.speed)*0.08; // accelerate slightly
      }
    }
  }

  // -- portal as attractor when hovered: nearby paths bend toward the CTA --
  if(portal.hover && !entering){
    var pdx=portal.x-a.x, pdy=portal.y-a.y, pd2=pdx*pdx+pdy*pdy, PR=CONFIG.portalHoverRadius;
    if(pd2 < PR*PR){
      var pf=1-Math.sqrt(pd2)/PR;
      a.h=angLerp(a.h, Math.atan2(pdy,pdx), CONFIG.portalHoverPull*pf);
      if(pf>a.near) a.near=pf*0.7;
    }
  }

  // -- Repair agents return the field toward centre when too dispersed --
  if(a.role===ROLE.REPAIR && dispersion>0.26){
    a.h=angLerp(a.h, Math.atan2(cyc-a.y,cxc-a.x), 0.05);
  }

  // -- ENTER convergence: still local rules; the field (above) does most of the steering,
  //    blended with a GENTLE portal bias + separation so agents stream in as reinforced arms --
  if(entering){
    var pdx=portal.x-a.x, pdy=portal.y-a.y, pdist=Math.sqrt(pdx*pdx+pdy*pdy)||1;
    var maxd=Math.hypot(W,H)*0.5;
    var tg=Math.atan2(pdy,pdx);
    var bias=CONFIG.portalAttractionStrength;
    if(a.role===ROLE.SCOUT) bias*=1.7;                 // scouts redirect first
    else if(a.role===ROLE.CONNECTOR) bias*=0.65;       // connectors keep longer, smoother paths
    // separation: closer to the portal -> stream tangentially (per-agent spin) instead of stacking
    var tang = a.spin * CONFIG.agentSeparationStrength * Math.max(0, 1 - pdist/(Math.min(W,H)*0.5));
    a.h = angLerp(a.h, tg + tang, bias);
    // speed scales up as agents near the portal -> visible compression/collapse
    a.speed = a.baseSpeed * CONFIG.transitionConvergenceSpeed * (1 + 0.9*(1 - Math.min(1,pdist/maxd)));
    if(a.role===ROLE.REPAIR) a.speed*=0.82;            // repair smooths / damps
  }

  // -- integrate (heading motion + decaying cursor drift -> calm idle) --
  a.dvx*=0.86; a.dvy*=0.86;
  var nx=a.x+Math.cos(a.h)*a.speed*CONFIG.speedMul*dt + a.dvx*dt;
  var ny=a.y+Math.sin(a.h)*a.speed*CONFIG.speedMul*dt + a.dvy*dt;
  a.speed += (a.baseSpeed-a.speed)*0.03;            // speed relaxes back to base
  var wrapped=false;
  if(nx<0){nx+=W;wrapped=true;} else if(nx>=W){nx-=W;wrapped=true;}
  if(ny<0){ny+=H;wrapped=true;} else if(ny>=H){ny-=H;wrapped=true;}

  // -- deposit pheromone + flow direction (numeric field) --
  var di=fieldIndex(nx,ny);
  var dep=a.deposit*CONFIG.pheromone*CONFIG.pheromoneDepositStrength*(1+a.near);
  if(entering){ dep*=CONFIG.transitionDepositBoost; if(a.role===ROLE.BUILDER) dep*=1.6; } // reinforce inward trails
  field[di]+= dep;
  flowX[di]+=Math.cos(a.h); flowY[di]+=Math.sin(a.h);

  // -- draw trail (thicker + a brighter streak near the cursor) --
  if(!wrapped){
    tctx.strokeStyle=a.color; tctx.lineWidth=a.tw*CONFIG.trailThickness*(1+a.near*1.6);
    tctx.beginPath(); tctx.moveTo(a.px,a.py); tctx.lineTo(nx,ny); tctx.stroke();
    if(a.near>0.45){
      tctx.strokeStyle='rgba('+a.dot+','+(0.10*a.near).toFixed(3)+')'; tctx.lineWidth=a.tw*CONFIG.trailThickness*0.8;
      tctx.beginPath(); tctx.moveTo(a.px,a.py); tctx.lineTo(nx,ny); tctx.stroke();
    }
  }
  a.x=nx; a.y=ny; a.px=nx; a.py=ny;

  // -- Connector agents occasionally draw a link to a nearby agent --
  if((a.role===ROLE.CONNECTOR && Math.random()<0.012) || (a.near>0.5 && Math.random()<0.04)) connect(a);

  // -- glow point (top layer; brighter near the cursor) --
  var nf=1+a.near*0.9;
  var sp=glow[a.role], sz=10*a.glow*(a.role===ROLE.BUILDER?1.25:1)*nf*CONFIG.agentSize;
  if(CONFIG.glowOn){
    octx.globalAlpha=Math.min(1,(0.85+a.near*0.4)*CONFIG.glowIntensity);
    octx.drawImage(sp, a.x-sz, a.y-sz, sz*2, sz*2);
    octx.globalAlpha=1;
  } else {
    var dc=DOTCOL[a.role]||'238,240,236';
    var rad=Math.max(0.8, 1.35*a.glow*CONFIG.agentSize*(1+a.near*0.35));
    octx.beginPath(); octx.arc(a.x,a.y,rad,0,6.283);
    octx.fillStyle='rgba('+dc+','+CONFIG.dotOpacity+')'; octx.fill();
  }
}

function connect(a){
  var best=null,bd=120*120;
  for(var i=0;i<agents.length;i+=3){            // sparse scan = cheap
    var b=agents[i]; if(b===a) continue;
    var dx=b.x-a.x, dy=b.y-a.y, d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=b; }
  }
  if(best){
    tctx.strokeStyle='rgba(232,177,90,0.10)'; tctx.lineWidth=0.7;
    tctx.beginPath(); tctx.moveTo(a.x,a.y); tctx.lineTo(best.x,best.y); tctx.stroke();
    deposit((a.x+best.x)/2,(a.y+best.y)/2, 1.0);
  }
}

/* ---------- 5. CURSOR INTERACTION ------------------------------------ */
var cursor={x:W/2,y:H/2,px:W/2,py:H/2,vx:0,vy:0,active:false,slow:true,fast:false,speed:0,last:0};
// custom circular cursor: eased position + agent-sensing energy
var cur={ex:W/2,ey:H/2,energy:0,shown:false};
function onMove(x,y){
  cursor.px=cursor.x; cursor.py=cursor.y; cursor.x=x; cursor.y=y;
  var dx=x-cursor.px, dy=y-cursor.py; cursor.speed=Math.sqrt(dx*dx+dy*dy);
  // smoothed cursor velocity (organic, not jerky)
  cursor.vx += (dx-cursor.vx)*0.35; cursor.vy += (dy-cursor.vy)*0.35;
  cursor.slow=cursor.speed<2.5; cursor.fast=cursor.speed>CONFIG.cursorFastSpeed;
  cursor.active=true; cursor.last=performance.now();
  // moving pheromone source: lay a continuous trail along the cursor path
  var steps=Math.min(6, 1+((cursor.speed/12)|0));
  for(var s=1;s<=steps;s++){ var t=s/steps;
    depositBlob(cursor.px+dx*t, cursor.py+dy*t,
                CONFIG.cursorDeposit*(cursor.slow?1.4:0.8), cursor.fast?9:20); }
  // liquid-glass lens follows the cursor (refracts the trails beneath)
  if(!reduced){ lensEl.style.transform='translate('+x+'px,'+y+'px)'; lensEl.style.opacity='0.7'; }
  if(cursorEl){ cur.shown=true; cursorEl.style.opacity='1'; }
  document.documentElement.style.setProperty('--mx', x+'px');
  document.documentElement.style.setProperty('--my', y+'px');
}
window.addEventListener('pointermove',function(e){ onMove(e.clientX,e.clientY); },{passive:true});
window.addEventListener('pointerout', function(){ cursor.active=false; lensEl.style.opacity='0'; if(cursorEl){ cur.shown=false; cursorEl.style.opacity='0'; } });

/* ---------- 6. PULSES (click anywhere except the portal) ------------- */
var pulses=[];
function pulse(x,y){
  pulses.push({x:x,y:y,t:performance.now()});
  depositBlob(x,y, 14, 30);                 // bright ring-ish source
  for(var i=0;i<agents.length;i++){          // scatter nearby agents outward
    var a=agents[i], dx=a.x-x, dy=a.y-y, d=Math.sqrt(dx*dx+dy*dy);
    if(d<150 && d>0.1){ a.h=Math.atan2(dy,dx); a.speed=a.baseSpeed*2.2; }
  }
}
function drawPulses(now){
  for(var i=pulses.length-1;i>=0;i--){
    var p=pulses[i], age=(now-p.t)/700; if(age>=1){ pulses.splice(i,1); continue; } if(age<0){ continue; }
    var rad=age*180, al=(1-age)*0.5;
    octx.strokeStyle='rgba(120,231,214,'+al+')'; octx.lineWidth=1.4;
    octx.beginPath(); octx.arc(p.x,p.y,rad,0,Math.PI*2); octx.stroke();
  }
}
window.addEventListener('pointerdown',function(e){
  if(e.target.closest('#ei-portal')) return;     // portal handled separately
  if(e.target.closest('#ei-tune')||e.target.closest('#ei-tune-btn')) return; // controls
  // register the tap/click as cursor presence so touch taps also influence the field
  cursor.px=cursor.x=e.clientX; cursor.py=cursor.y=e.clientY;
  cursor.vx=cursor.vy=0; cursor.active=true; cursor.last=performance.now();
  pulse(e.clientX,e.clientY);
});

/* ---------- 7. GLASS PORTAL (attractor + glow) ----------------------- */
var portal={x:W/2,y:H*0.64,hover:false};
function updatePortalCentre(){
  var r=portalEl.getBoundingClientRect();
  portal.x=r.left+r.width/2; portal.y=r.top+r.height/2;
  portalPts.length=0;
  for(var i=0;i<portalEls.length;i++){ var rr=portalEls[i].getBoundingClientRect();
    portalPts.push({x:rr.left+rr.width/2, y:rr.top+rr.height/2}); }
  document.documentElement.style.setProperty('--px', portal.x+'px');
  document.documentElement.style.setProperty('--py', portal.y+'px');
  // aperture must always overscan the screen
  CONFIG._apscale = Math.ceil(Math.hypot(W,H)/14*1.25);
  document.documentElement.style.setProperty('--apscale', CONFIG._apscale);
}
portalEls.forEach(function(el){
  el.addEventListener('pointerenter',function(){ portal.hover=true; if(portalEl!==el){ portalEl=el; updatePortalCentre(); } });
  el.addEventListener('pointerleave',function(){ portal.hover=false; });
});

function depositPortal(){
  // portal becomes a real pheromone attractor when hovered / entering
  if(entering){ depositBlob(portal.x,portal.y, CONFIG.portalPheromoneStrength, Math.min(W,H)*0.20); return; }
  for(var i=0;i<portalPts.length;i++){                       // three ambient pheromone points
    depositBlob(portalPts[i].x, portalPts[i].y, CONFIG.portalAttract*0.5, 64); }
  if(portal.hover) depositBlob(portal.x,portal.y, CONFIG.portalAttract, 70);
}
function drawPortalGlow(){
  if(!portal.hover && !entering) return;
  var R=entering?260:120, a=entering?0.32:0.14;
  var g=octx.createRadialGradient(portal.x,portal.y,0,portal.x,portal.y,R);
  g.addColorStop(0,'rgba(120,231,214,'+a+')');
  g.addColorStop(1,'rgba(120,231,214,0)');
  octx.fillStyle=g; octx.beginPath(); octx.arc(portal.x,portal.y,R,0,Math.PI*2); octx.fill();
}

/* ---------- 8. RENDER LOOP (performance) ----------------------------- */
var raf=0, lastT=0, hidden=false, frameN=0, fps=60, fpsT=0;
function loop(now){
  raf=requestAnimationFrame(loop);
  if(hidden) return;
  var dt=Math.min(2.2,(now-lastT)/16.667)||1; lastT=now;

  // dispersion measured periodically (cheap)
  if((dispTick++ %15)===0) measureDispersion();

  flowNow=now;
  // transition is driven by the agent field: fire the membrane once it has collapsed inward
  if(entering && !apertureStarted && (now-enterT0)>=CONFIG.transitionOverlayDelay){
    if(meanPortalDist() < CONFIG.transitionConvergeFrac*enterD0) beginAperture();
  }

  stepField();                       // pheromone decay + diffusion

  // fade the visible trails toward transparent (memory decay)
  tctx.globalCompositeOperation='destination-out';
  var _tf=entering?CONFIG.transitionTrailFade:(0.105-CONFIG.trailVisibility*0.095); tctx.fillStyle='rgba(0,0,0,'+_tf+')';
  tctx.fillRect(0,0,W,H);
  tctx.globalCompositeOperation='source-over';

  octx.clearRect(0,0,W,H);
  octx.globalCompositeOperation='lighter';   // additive glow

  depositPortal();
  for(var i=0;i<agents.length;i++) updateAgent(agents[i],dt);
  updateCursor();
  if((chTick++ %2)===0){ updateTitle(); updatePortalMagnet(); }
  drawPulses(now);
  drawPortalGlow();
  if(window.updateNameParticles) window.updateNameParticles();

  octx.globalCompositeOperation='source-over';

  // cursor velocity & influence ease out when idle (agents settle, never freeze)
  cursor.vx*=0.9; cursor.vy*=0.9;
  if(cursor.active && now-cursor.last>900){ cursor.active=false; lensEl.style.opacity='0'; }

  // HUD readout (computational-interface flavour) ~5x/sec
  if(now-fpsT>200){ fps=Math.round(1000/(dt*16.667)); fpsT=now; updateHUD(); }
  frameN++;
}
/* custom circular cursor: eased follow + nearest-agent sensing energy */
function updateCursor(){
  if(!cursorEl) return;
  var ef = reduced?0.5:0.2;                      // easing (smooth, not snapping)
  cur.ex += (cursor.x-cur.ex)*ef; cur.ey += (cursor.y-cur.ey)*ef;
  // nearest agent distance + local crowding -> energy
  var RR=CONFIG.cursorReact, rr2=RR*RR, best=rr2, cnt=0;
  for(var i=0;i<agents.length;i++){
    var ax=agents[i].x-cur.ex, ay=agents[i].y-cur.ey, dd=ax*ax+ay*ay;
    if(dd<best) best=dd;
    if(dd<rr2) cnt++;
  }
  var nd=Math.sqrt(best);
  var e=Math.max(0,1-nd/RR);                      // closer agent -> more energy
  e=Math.min(1, e + Math.min(cnt,8)/8*0.25);      // many agents near -> more energised
  if(reduced) e*=0.5;                             // simplified reaction
  cur.energy += (e-cur.energy)*0.18;              // ease back when agents leave
  var sc=1+cur.energy*CONFIG.cursorMaxScale;      // up to ~1.35
  cursorEl.style.transform='translate3d('+cur.ex.toFixed(2)+'px,'+cur.ey.toFixed(2)+'px,0) scale('+sc.toFixed(3)+')';
  cursorEl.style.setProperty('--e', cur.energy.toFixed(3));
}

/* ---------- interactive title (letters yield to the cursor) ---------- */
var chars=[], chTick=0;
function buildTitle(){
  var h=document.querySelector('.ei-title'); if(!h) return;
  var words=h.textContent.trim().split(/\s+/);
  h.setAttribute('aria-label', h.textContent.trim());
  h.textContent='';
  words.forEach(function(wd,wi){
    var w=document.createElement('span'); w.className='ei-w'; w.setAttribute('aria-hidden','true');
    for(var i=0;i<wd.length;i++){
      var c=document.createElement('span'); c.className='ei-ch'; c.textContent=wd[i];
      w.appendChild(c); chars.push({el:c,bx:0,by:0,ox:0,oy:0});
    }
    h.appendChild(w);
    if(wi<words.length-1) h.appendChild(document.createTextNode(' '));
  });
  measureTitle();
}
function measureTitle(){   // cache untransformed letter centres
  chars.forEach(function(c){ var t=c.el.style.transform; c.el.style.transform='none';
    var r=c.el.getBoundingClientRect(); c.bx=r.left+r.width/2; c.by=r.top+r.height/2;
    c.el.style.transform=t; });
}
function updateTitle(){
  if(reduced || !chars.length) return;
  var R=130, k=14;
  for(var i=0;i<chars.length;i++){
    var c=chars[i], dx=c.bx-cur.ex, dy=c.by-cur.ey, d=Math.sqrt(dx*dx+dy*dy);
    var tx=0, ty=0;
    if(cur.shown && d<R && d>0.1){
      var f=Math.pow(1-d/R,1.5)*k;
      tx=dx/d*f; ty=dy/d*f;
      // displaced letters shed pheromone -> agents come trace the name
      if(f>5 && Math.random()<0.08) depositBlob(c.bx,c.by,2.5,10);
    }
    c.ox+=(tx-c.ox)*0.18; c.oy+=(ty-c.oy)*0.18;     // eased, organic
    if(Math.abs(c.ox)>0.05||Math.abs(c.oy)>0.05)
      c.el.style.transform='translate3d('+c.ox.toFixed(2)+'px,'+c.oy.toFixed(2)+'px,0)';
    else if(c.el.style.transform) c.el.style.transform='';
  }
}
/* ---------- magnetic portal (drifts a few px toward a near cursor) ---- */
function updatePortalMagnet(){
  if(reduced || entering) return;
  for(var pi=0; pi<portalEls.length; pi++){
    var el=portalEls[pi], r=el.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height/2;
    var dx=cursor.x-cx, dy=cursor.y-cy, d=Math.sqrt(dx*dx+dy*dy), R=150, m=7;
    var gx=0, gy=0;
    if(cur.shown && d<R && d>0.1){ var f=(1-d/R)*m; gx=dx/d*f; gy=dy/d*f; }
    el.style.setProperty('--mgx', gx.toFixed(2)+'px');
    el.style.setProperty('--mgy', gy.toFixed(2)+'px');
  }
}

function updateHUD(){
  if(reduced){ hudEl.textContent=''; return; }
  hudEl.innerHTML='Agents <b>'+agents.length+'</b><br>Density <b>'+dispersion.toFixed(3)+'</b><br>'+
                  (cursor.fast?'State <b>turbulent</b>':cursor.slow&&cursor.active?'State <b>clustering</b>':'State <b>foraging</b>');
}

/* ---------- 9. CLICK-THROUGH TRANSITION ------------------------------ */
var entering=false, entered=false;
var apertureStarted=false, enterT0=0, enterD0=1;
function meanPortalDist(){
  if(!agents.length) return 0; var s=0;
  for(var i=0;i<agents.length;i++){ var dx=agents[i].x-portal.x, dy=agents[i].y-portal.y; s+=Math.sqrt(dx*dx+dy*dy); }
  return s/agents.length;
}
function enter(){
  if(entered) return; entered=true;
  updatePortalCentre();

  if(reduced){                         // reduced motion: quiet fade
    document.body.classList.add('ei-flash');
    setTimeout(go, 460); return;
  }
  // portal becomes the strongest pheromone source; agents begin converging via LOCAL rules now.
  document.body.classList.add('ei-entering');
  cursor.active=false;                 // cursor influence disabled during transition
  entering=true;                       // re-weights agent rules (follow + portal source + reinforce)
  apertureStarted=false; enterT0=performance.now(); enterD0=Math.max(1, meanPortalDist());
  // hard fallback so navigation always proceeds even if convergence stalls
  setTimeout(function(){ beginAperture(); }, CONFIG.transitionFallback);
}
// the full-screen membrane is synchronised to the agent field: it begins only once the
// reinforced field has measurably collapsed toward the portal (or the fallback fires).
function beginAperture(){
  if(apertureStarted) return; apertureStarted=true;
  if(!CONFIG.bloomOn){                             // bloom disabled -> quiet fade
    document.body.classList.add('ei-flash');
    setTimeout(go, 520); return;
  }
  document.body.classList.add('ei-bloom-open');   // organic membrane blooms from the portal
  setTimeout(go, 1050);
}
function go(){ window.location.href = resolvedURL; }

/* Resolve which portfolio file actually exists.
   - On file:// (local double-click) browsers block probing, so we simply use
     the primary filename (must sit next to index.html).
   - On http/https (e.g. GitHub Pages) we HEAD-probe candidates and pick the
     first that exists, so either filename works without re-editing. */
var resolvedURL = CONFIG.portfolioURL;
function resolvePortfolio(){
  if(location.protocol==='file:') return;            // local: rely on primary name
  var list=[CONFIG.portfolioURL].concat(CONFIG.portfolioCandidates||[]);
  list=list.filter(function(v,i){return v && list.indexOf(v)===i;});
  (function next(i){
    if(i>=list.length) return;                        // none found -> keep primary
    fetch(list[i],{method:'HEAD'}).then(function(r){
      if(r&&r.ok){ resolvedURL=list[i]; portalEl.setAttribute('href',resolvedURL); }
      else next(i+1);
    }).catch(function(){ next(i+1); });
  })(0);
}

portalEls.forEach(function(el){
  function goEl(e){ e.preventDefault(); if(entered) return;
    portalEl=el; resolvedURL=el.getAttribute('data-href')||resolvedURL;
    updatePortalCentre(); enter(); }
  el.addEventListener('click',goEl);
  el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ goEl(e); } });
});

/* ---------- lifecycle: resize / visibility --------------------------- */
var rtimer;
window.addEventListener('resize',function(){
  clearTimeout(rtimer);
  rtimer=setTimeout(function(){
    var ox=W, oy=H; setup();
    // keep agents proportional to the new size
    for(var i=0;i<agents.length;i++){ agents[i].x*=W/ox; agents[i].y*=H/oy; agents[i].px=agents[i].x; agents[i].py=agents[i].y; }
    if(!agentsUserSet) agentTarget=agentCount();
    setAgentCount(agentTarget);
    measureTitle();
  },180);
});
document.addEventListener('visibilitychange',function(){ hidden=document.hidden; lastT=performance.now(); });

/* ---------- agent-behaviour control panel (live sliders) ------------- */
var SLIDERS=[
  {k:'agents',      label:'Agents',        min:30,  max:280, step:2,    dp:0, agent:true},
  {k:'speedMul',    label:'Speed',         min:0.4, max:2.5, step:0.05, dp:2},
  {k:'wander',      label:'Wander',        min:0,   max:2.5, step:0.05, dp:2},
  {k:'flowField',   label:'Flow field',    min:0,   max:0.35,step:0.01, dp:2},
  {k:'trailVisibility',label:'Trail visibility',min:0,   max:1,   step:0.02, dp:2},
  {k:'trailThickness',label:'Trail thickness',min:0.5, max:3.0, step:0.1,  dp:1},
  {k:'agentSize',   label:'Agent size',    min:0.5, max:2.5, step:0.05, dp:2},
  {k:'glowIntensity',label:'Glow intensity',min:0.2, max:1.6, step:0.05, dp:2},
  {k:'dotOpacity',  label:'Dot opacity',   min:0.2, max:1.0, step:0.05, dp:2},
  {k:'pheromone',   label:'Pheromone',     min:0.2, max:2.5, step:0.05, dp:2},
  {k:'align',       label:'Alignment',     min:0,   max:0.20,step:0.01, dp:2},
  {k:'cursorRadius',label:'Cursor radius', min:80,  max:360, step:5,    dp:0},
  {k:'cursorPullMul',label:'Cursor pull',  min:0,   max:3,   step:0.05, dp:2},
  {k:'cursorForce', label:'Turbulence',    min:0,   max:3,   step:0.05, dp:2},
  {k:'portalAttract',label:'Portal pull',  min:0,   max:20,  step:0.5,  dp:1}
];
var TUNE_DEFAULTS={};
function buildPanel(){
  var rows=document.getElementById('ei-tune-rows'); if(!rows) return;
  TUNE_DEFAULTS.agents=agentTarget;
  SLIDERS.forEach(function(sl){
    var val = sl.agent ? agentTarget : CONFIG[sl.k];
    if(!sl.agent) TUNE_DEFAULTS[sl.k]=CONFIG[sl.k];
    var row=document.createElement('div'); row.className='ei-row';
    var lab=document.createElement('span'); lab.className='ei-row-l';
    lab.innerHTML=sl.label+'<b id="ev-'+sl.k+'">'+(+val).toFixed(sl.dp)+'</b>';
    var inp=document.createElement('input'); inp.type='range';
    inp.min=sl.min; inp.max=sl.max; inp.step=sl.step; inp.value=val;
    inp.setAttribute('aria-label', sl.label);
    inp.addEventListener('input', function(){
      var v=parseFloat(inp.value);
      document.getElementById('ev-'+sl.k).textContent=v.toFixed(sl.dp);
      if(sl.agent){ agentsUserSet=true; setAgentCount(v); } else { CONFIG[sl.k]=v; }
    });
    row.appendChild(lab); row.appendChild(inp); rows.appendChild(row);
    sl._input=inp;
  });
  // Glow on/off toggle (off = crisp particle dots, matching the logo style)
  TUNE_DEFAULTS.glowOn=CONFIG.glowOn;
  (function(){
    var trow=document.createElement('div'); trow.className='ei-row';
    var tl=document.createElement('span'); tl.className='ei-row-l'; tl.textContent='Glow';
    var tb=document.createElement('button'); tb.type='button';
    tb.style.cssText='font:inherit;cursor:pointer;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 14px;letter-spacing:.12em;text-transform:uppercase;font-size:10px';
    function paint(){ tb.textContent=CONFIG.glowOn?'On':'Off'; tb.setAttribute('aria-pressed',String(CONFIG.glowOn)); }
    paint();
    tb.addEventListener('click', function(){ CONFIG.glowOn=!CONFIG.glowOn; paint(); });
    trow.appendChild(tl); trow.appendChild(tb); rows.appendChild(trow);
    window.__glowTb=tb;
  })();
  // Bloom transition + Light mode toggles
  TUNE_DEFAULTS.bloomOn=CONFIG.bloomOn; TUNE_DEFAULTS.lightMode=CONFIG.lightMode;
  function mkToggle(label,get,set){
    var trow=document.createElement('div'); trow.className='ei-row';
    var tl=document.createElement('span'); tl.className='ei-row-l'; tl.textContent=label;
    var tb=document.createElement('button'); tb.type='button';
    tb.style.cssText='font:inherit;cursor:pointer;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 14px;letter-spacing:.12em;text-transform:uppercase;font-size:10px';
    function paint(){ tb.textContent=get()?'On':'Off'; tb.setAttribute('aria-pressed',String(get())); }
    paint(); tb._paint=paint;
    tb.addEventListener('click', function(){ set(!get()); paint(); });
    trow.appendChild(tl); trow.appendChild(tb); rows.appendChild(trow);
    return tb;
  }
  window.__bloomTb=mkToggle('Bloom', function(){return CONFIG.bloomOn;}, function(v){CONFIG.bloomOn=v;});
  window.__lightTb=mkToggle('Light mode', function(){return CONFIG.lightMode;},
    function(v){ CONFIG.lightMode=v; document.body.classList.toggle('ei-light', v); });
  var btn=document.getElementById('ei-tune-btn'), panel=document.getElementById('ei-tune');
  btn.addEventListener('click', function(){
    var open=!panel.classList.contains('open');
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', open?'false':'true');
    btn.setAttribute('aria-expanded', open?'true':'false');
    btn.innerHTML = open ? 'Tune\u00a0\u25be' : 'Tune\u00a0\u25b8';
  });
  document.getElementById('ei-tune-reset').addEventListener('click', function(){
    SLIDERS.forEach(function(sl){
      var d = sl.agent ? TUNE_DEFAULTS.agents : TUNE_DEFAULTS[sl.k];
      sl._input.value=d; document.getElementById('ev-'+sl.k).textContent=(+d).toFixed(sl.dp);
      if(sl.agent){ agentsUserSet=false; setAgentCount(d); } else { CONFIG[sl.k]=d; }
    });
    CONFIG.glowOn=TUNE_DEFAULTS.glowOn;
    if(window.__glowTb){ window.__glowTb.textContent=CONFIG.glowOn?'On':'Off'; window.__glowTb.setAttribute('aria-pressed',String(CONFIG.glowOn)); }
    CONFIG.bloomOn=TUNE_DEFAULTS.bloomOn; if(window.__bloomTb) window.__bloomTb._paint();
    CONFIG.lightMode=TUNE_DEFAULTS.lightMode; document.body.classList.toggle('ei-light', CONFIG.lightMode);
    if(window.__lightTb) window.__lightTb._paint();
  });
}

/* ---------- boot ----------------------------------------------------- */
setup(); seedAgents(); resolvePortfolio();
agentTarget=agents.length; buildPanel();
buildTitle();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(measureTitle);
// seed a little starting pheromone so paths form quickly
for(var s=0;s<agents.length;s++) depositBlob(agents[s].x,agents[s].y,3,14);
lastT=performance.now();
raf=requestAnimationFrame(loop);

})();
</script>
<style>
.ei-title-wrap{margin:0;line-height:0;display:flex;justify-content:center}
.ei-name-canvas{display:block;width:min(92vw,1040px);height:auto;aspect-ratio:1040/150;pointer-events:none}
@media (max-width:620px){ .ei-name-canvas{aspect-ratio:1040/330} }
</style>
<script>
(function(){
  var canvas=document.getElementById('ei-name-canvas'); if(!canvas) return;
  var ctx=canvas.getContext('2d'); if(!ctx) return;
  var DPR=Math.min(2, window.devicePixelRatio||1);
  var FONT="'Fraunces', Georgia, serif";
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pts=[], cssW=0, cssH=0, rectC={left:0,top:0}, layout=null, t=0, mouse={x:-9999,y:-9999,active:false};

  function build(){
    var r=canvas.getBoundingClientRect(); cssW=r.width;
    if(cssW<2){ requestAnimationFrame(build); return; }
    var lines = cssW<620 ? ["Emmanuel Appiah","Acheampong"] : ["Emmanuel Appiah Acheampong"];
    var sampW=Math.min(980, Math.round(cssW));
    var off=document.createElement('canvas'); var oc=off.getContext('2d');
    var fp=140; oc.font='300 '+fp+"px "+FONT;
    var mw=0; lines.forEach(function(l){ mw=Math.max(mw, oc.measureText(l).width); });
    fp = fp*(sampW*0.95)/mw;
    var lineH=fp*1.04, sampH=Math.ceil(lineH*lines.length + fp*0.5);
    off.width=sampW; off.height=sampH; oc=off.getContext('2d');
    oc.font='300 '+fp+"px "+FONT; oc.fillStyle='#fff'; oc.textAlign='center'; oc.textBaseline='middle';
    var y0=sampH/2-(lines.length-1)*lineH/2;
    lines.forEach(function(l,i){ oc.fillText(l, sampW/2, y0+i*lineH); });
    var ratio=sampH/sampW; cssH=cssW*ratio;
    canvas.style.height=cssH+'px';
    canvas.width=Math.round(cssW*DPR); canvas.height=Math.round(cssH*DPR);
    layout={fp:fp,lineH:lineH,lines:lines,sampW:sampW,sampH:sampH};
    if(reduced){ drawStatic(); return; }
    var data; try{ data=oc.getImageData(0,0,sampW,sampH).data; }catch(e){ drawStatic(); return; }
    var step=Math.max(2, Math.round(sampW/240)), sx=cssW/sampW, sy=cssH/sampH;
    pts.length=0;
    for(var y=0;y<sampH;y+=step) for(var x=0;x<sampW;x+=step){
      if(data[(y*sampW+x)*4+3]>60){ var hx=x*sx, hy=y*sy; pts.push({hx:hx,hy:hy,x:hx+(Math.random()-0.5)*64,y:hy+(Math.random()-0.5)*64,vx:0,vy:0}); }
    }
    rectC=canvas.getBoundingClientRect();
  }
  function drawStatic(){
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,cssW,cssH);
    var fp=layout.fp*(cssW/layout.sampW), lh=fp*1.04;
    ctx.fillStyle='#f4f3ee'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='300 '+fp+"px "+FONT;
    var y0=cssH/2-(layout.lines.length-1)*lh/2;
    layout.lines.forEach(function(l,i){ ctx.fillText(l,cssW/2,y0+i*lh); });
  }
  window.updateNameParticles=function(){
    if(reduced || !pts.length) return;
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,cssW,cssH);
    ctx.globalCompositeOperation='lighter';
    var active=mouse.active, mx=mouse.x, my=mouse.y;
    var R=active?116:0, R2=R*R, i, p;
    for(i=0;i<pts.length;i++){ p=pts[i];
      p.vx+=(p.hx-p.x)*0.06; p.vy+=(p.hy-p.y)*0.06;
      if(active){ var dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;
        if(d2<R2&&d2>0.01){ var d=Math.sqrt(d2),f=(R-d)/R*4.5; p.vx+=dx/d*f; p.vy+=dy/d*f;
          if(f>2.2 && Math.random()<0.05 && typeof depositBlob==='function') depositBlob(rectC.left+p.x, rectC.top+p.y, 2.2, 9); } }
      p.vx*=0.86; p.vy*=0.86; p.x+=p.vx; p.y+=p.vy;
      var sp=Math.min(1,(Math.abs(p.vx)+Math.abs(p.vy))*0.16);
      ctx.beginPath(); ctx.arc(p.x,p.y,1.35,0,6.283);
      ctx.fillStyle = sp>0.42 ? 'rgba(120,231,214,'+(0.7+0.3*sp)+')' : 'rgba(244,243,238,'+(0.8+0.2*sp)+')';
      ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  };
  function nmove(e){ mouse.x=e.clientX-rectC.left; mouse.y=e.clientY-rectC.top; mouse.active=true; }
  function nleave(){ mouse.active=false; }
  window.addEventListener('pointermove', nmove, {passive:true});
  document.addEventListener('pointerleave', nleave);
  window.addEventListener('resize', function(){ clearTimeout(t); t=setTimeout(build,160); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(build); else build();
})();
</script>
