<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Movement and landscape</title>
  <desc id="desc">An interpretive diagram tracing a road approach to the arrival court, pedestrian links to hotel and event spaces, and a planted outdoor route. It is not a measured plan.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a87f5d" stroke-width="1.7"/></marker>
    <marker id="walk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#587b83" stroke-width="1.7"/></marker>
  </defs>
  <style>
    .flow{stroke-dasharray:18 14;animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-64}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="92" y="98" font-size="24" font-weight="700" letter-spacing="5" fill="#6b756b">04 / MOVEMENT</text>
    <text x="1508" y="98" text-anchor="end" font-size="20" letter-spacing="2" fill="#6b756b">CONCEPT STUDY · NOT TO SCALE</text>
    <path d="M96 128H1504" stroke="#9da99d" stroke-opacity=".52" stroke-width="2"/>
    <path d="M145 776H1455" stroke="#818d84" stroke-width="54" stroke-linecap="round" opacity=".38"/>
    <path d="M145 776H1455" stroke="#e9e9e1" stroke-width="3" stroke-dasharray="45 30"/>
    <text x="160" y="842" font-size="19" font-weight="700" letter-spacing="3" fill="#667369">MAIN ROAD</text>
    <path d="M196 178V700M1404 178V700" stroke="#8eaa89" stroke-opacity=".68" stroke-width="38" stroke-linecap="round" stroke-dasharray="2 55"/>
    <rect x="240" y="235" width="384" height="260" rx="28" fill="#b9c9cb" fill-opacity=".72" stroke="#6e8588" stroke-width="3"/>
    <text x="278" y="281" font-size="27" font-weight="700" letter-spacing="3" fill="#324849">HOTEL + SUITES</text>
    <path d="M279 322H581M279 372H581M279 422H581" stroke="#6e8588" stroke-opacity=".55" stroke-width="2"/>
    <rect x="976" y="235" width="384" height="260" rx="28" fill="#d9c7b4" fill-opacity=".8" stroke="#9d765e" stroke-width="3"/>
    <text x="1014" y="281" font-size="27" font-weight="700" letter-spacing="3" fill="#654e40">EVENT CENTRE</text>
    <path d="M1015 351H1321M1015 422H1321" stroke="#9d765e" stroke-opacity=".55" stroke-width="2"/>
    <rect x="706" y="289" width="188" height="118" rx="22" fill="#c2a083" stroke="#977154" stroke-width="3"/>
    <text x="800" y="333" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2" fill="#493b31">SHARED</text>
    <text x="800" y="361" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2" fill="#493b31">LOBBY</text>
    <path d="M800 733V585" fill="none" stroke="#a87f5d" stroke-width="11" marker-end="url(#arrow)"/>
    <path d="M800 733V585" class="flow" fill="none" stroke="#f5e9d9" stroke-width="4"/>
    <rect x="676" y="510" width="248" height="125" rx="48" fill="#dec6ad" fill-opacity=".83" stroke="#ac845f" stroke-width="3"/>
    <text x="800" y="551" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="2" fill="#654e40">DROP-OFF</text>
    <text x="800" y="585" text-anchor="middle" font-size="18" fill="#654e40">+ CANOPY</text>
    <path d="M708 355H636M894 355H964" fill="none" stroke="#587b83" stroke-width="9" stroke-linecap="round" marker-end="url(#walk-arrow)"/>
    <path d="M708 355H636M894 355H964" class="flow" fill="none" stroke="#e6f2f0" stroke-width="3"/>
    <path d="M680 590C570 547 465 546 380 579C336 596 337 646 415 657H1190C1273 656 1282 596 1190 577C1102 559 1016 569 921 590" fill="none" stroke="#88a47b" stroke-opacity=".76" stroke-width="36" stroke-linecap="round"/>
